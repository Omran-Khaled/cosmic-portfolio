<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting…</title>
    <script>
      // Preserve the original requested path and redirect to index.html
      const path = decodeURIComponent(location.pathname);
      const qs = location.search;
      const hash = location.hash;
      const target = "/cosmic-portfolio/index.html?p=" + encodeURIComponent(path) + qs + hash;
      if (path === "/cosmic-portfolio/" || path === "/cosmic-portfolio/index.html") {
        location.replace("/cosmic-portfolio/");
      } else {
        location.replace(target);
      }
    </script>
  </head>
  <body></body>
</html>
