<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting…</title>
    <script>
      // SPA fallback: redirect all routes to index.html for client-side routing
      const path = decodeURIComponent(location.pathname);
      const qs = location.search;
      const hash = location.hash;
      // Redirect to index.html, preserving query params and hash
      const target = "/cosmic-portfolio/index.html" + qs + hash;
      // Avoid infinite loop: only redirect if not already on index.html
      if (path !== "/cosmic-portfolio/index.html" && path !== "/cosmic-portfolio/") {
        location.replace(target);
      }
    </script>
  </head>
  <body></body>
</html>
