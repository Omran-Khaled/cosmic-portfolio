name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-deploy"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting
        run: pnpm lint

      - name: Build project
        run: pnpm build

      - name: Verify build output
        run: |
          # Verify all critical assets exist in the build output
          test -f dist/client/index.html
          test -f dist/client/_redirects
          test -f dist/client/404.html
          test -f dist/client/favicon.svg
          test -f dist/client/khuta.mp4
          test -f dist/client/library.mp4
          test -f dist/client/wandr.mp4
          test -f dist/client/cv/omran_khaled_cv.pdf
          test -f dist/client/assets/index.js
          echo "✅ All critical assets verified in build output"

      - name: Upload build artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
