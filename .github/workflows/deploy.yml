name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  # Required to read repository files during checkout.
  contents: read
  # Required by actions/deploy-pages to publish to GitHub Pages.
  pages: write
  # Required for OIDC token exchange used by Pages deployment.
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting
        run: pnpm lint

      - name: Build project
        run: pnpm build

      - name: Validate Pages artifact directory
        run: |
          if [ ! -d "./dist/client" ]; then
            echo "::error::Expected build output directory './dist/client' was not found."
            echo "Troubleshooting: confirm the app build still outputs client files to ./dist/client."
            exit 1
          fi
          if [ -z "$(find ./dist/client -mindepth 1 -maxdepth 1)" ]; then
            echo "::error::Build output directory './dist/client' is empty."
            echo "Troubleshooting: inspect the build logs and verify static files are generated."
            exit 1
          fi
          echo "Build output validation passed."

      - name: Upload build artifacts
        # Uploads static site files for the deploy job.
        uses: actions/upload-pages-artifact@v3
        with:
          # Must match the validated output directory.
          path: ./dist/client

  deploy:
    # GitHub Pages requires this environment name.
    environment:
      name: github-pages
      # Exposes the deployed site URL in the workflow summary.
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Validate Pages configuration prerequisites
        run: |
          echo "If deployment fails quickly, verify repository settings:"
          echo "1) Settings -> Pages -> Source must be 'GitHub Actions'"
          echo "2) GitHub Pages must be enabled for this repository"
          echo "3) Workflow permissions must allow Pages + ID token"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report deployment status
        if: always()
        run: |
          if [ "${{ steps.deployment.outcome }}" = "success" ]; then
            echo "Deployment succeeded: ${{ steps.deployment.outputs.page_url }}"
          else
            echo "::error::Deployment failed."
            echo "Troubleshooting:"
            echo "- Ensure Settings -> Pages -> Source is set to 'GitHub Actions'."
            echo "- Ensure repository-level Pages is enabled."
            echo "- Ensure build artifact exists and is not empty."
            exit 1
          fi
